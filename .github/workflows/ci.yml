name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # lib/ is committed so `dsh plugin add github:so16tm/dsh-locale-ja` works without a build step.
      - name: Committed lib/ matches the build
        run: git diff --exit-code -- lib
